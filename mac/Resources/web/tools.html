<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Aster Study Tools</title>
<link rel="stylesheet" href="tools.css">
<script type="module" src="tools.js"></script>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="Study tools">
  <button role="tab" data-view="planner" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg><span>Planner</span></button>
  <button role="tab" data-view="cards"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="4" width="10" height="9" rx="1.5"/><path d="M5 2h8.5a.5.5 0 0 1 .5.5V10"/></svg><span>Cards</span></button>
  <button role="tab" data-view="library"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 2.5H6v11H2.5zM7.5 2.5H10v11H7.5zM11.2 3.1l2.3-.6 2 10.6-2.3.6z"/></svg><span>Library</span></button>
  <button role="tab" data-view="bookmarks"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg><span>Bookmarks</span></button>
  <button role="tab" data-view="data"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 13.5h11M4.5 11V8M8 11V4.5M11.5 11V6.5"/></svg><span>Data</span></button>
  <button role="tab" data-view="backup"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3M2.5 11.5v1.5h11v-1.5"/></svg><span>Backup</span></button>
</nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<main>
  <section id="planner" class="view" role="tabpanel"></section>
  <section id="cards" class="view" role="tabpanel" hidden></section>
  <section id="library" class="view" role="tabpanel" hidden></section>
  <section id="bookmarks" class="view" role="tabpanel" hidden></section>
  <section id="data" class="view" role="tabpanel" hidden></section>
  <section id="backup" class="view" role="tabpanel" hidden></section>
</main>
</body>
</html>
