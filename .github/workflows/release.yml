name: Release
# Publishes a GitHub Release with the downloadable modules zip, source
# archives and checksums. Start it either way:
#   - push a version tag such as v0.2.0, or
#   - Actions → Release → "Run workflow" on main; the tag v<package.json
#     version> is then created on the tested commit.
# Source-only milestone tags (v*-source) use source-release.yml.
on:
  push:
    tags: ['v*', '!v*-source']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  mac:
    # Builds, unit-tests and self-tests the Mac app and uploads the .dmg.
    uses: ./.github/workflows/mac-app.yml
  release:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Work out the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Run the release workflow from main" >&2
              exit 1
            fi
            if gh release view "$expected" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$expected" >/dev/null; then
              echo "$expected already exists; bump the version in package.json first" >&2
              exit 1
            fi
          fi
          echo "TAG=$expected" >> "$GITHUB_ENV"
          echo "VERSION=${expected#v}" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python scripts/test_core.py --sanitize
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: aster-mac
          path: work/mac
      - name: Build downloads
        run: |
          python scripts/package_modules.py
          python scripts/source_release.py
          find work/mac -name "Aster-$VERSION.dmg" -exec cp {} work/dist/ \;
          test -f "work/dist/Aster-$VERSION.dmg"
          cd work/dist
          sha256sum *.dmg *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Test the packaged zip on its own
        run: |
          mkdir -p /tmp/check && cd /tmp/check
          unzip -q "$GITHUB_WORKSPACE/work/dist/aster-modules-$VERSION.zip"
          cd "aster-modules-$VERSION"
          npm test
          node examples/quickstart.mjs
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag on this exact tested commit when it does
        # not exist yet (workflow_dispatch); for a pushed tag it already does.
        run: >
          gh release create "$TAG" --target "$GITHUB_SHA" --latest
          --title "Aster $TAG"
          --notes-file docs/RELEASE_NOTES.md
          work/dist/*
