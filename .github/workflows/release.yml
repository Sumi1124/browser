name: Release
# Pushing a version tag such as v0.2.0 tests the commit, builds the
# downloadable modules zip and source archives, and publishes a GitHub
# Release. Source-only milestone tags (v*-source) use source-release.yml.
on:
  push:
    tags: ['v*', '!v*-source']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python scripts/test_core.py --sanitize
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build downloads
        run: |
          python scripts/package_modules.py
          python scripts/source_release.py
          cd work/dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Test the packaged zip on its own
        run: |
          mkdir -p /tmp/check && cd /tmp/check
          unzip -q "$GITHUB_WORKSPACE/work/dist/aster-modules-${GITHUB_REF_NAME#v}.zip"
          cd "aster-modules-${GITHUB_REF_NAME#v}"
          npm test
          node examples/quickstart.mjs
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease
          --title "Aster $GITHUB_REF_NAME — study and research modules"
          --notes-file docs/RELEASE_NOTES.md
          work/dist/*
