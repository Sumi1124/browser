name: Promote release
# Turns an existing pre-release into the repository's latest full release, so
# https://github.com/<owner>/<repo>/releases/latest points to it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, e.g. v0.4.0
        required: true
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must look like v1.2.3" >&2; exit 1 ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '.isDraft' | grep -qx false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
